    <script>
        const backBtn = document.querySelector('.back-to-home');
        let scrollTimeout;
        backBtn.classList.add('visible');
        window.addEventListener('scroll', () => {
            backBtn.classList.remove('visible');
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                backBtn.classList.add('visible');
            }, 400);
        });
    </script>
